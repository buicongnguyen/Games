<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sky Drill</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="stage" aria-label="Sky Drill game">
        <div id="game-root" class="game-root"></div>

        <header class="hud hud-top" aria-label="Game status">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true"></span>
            <span>Sky Drill</span>
          </div>
          <div class="stats">
            <span>Stage <strong id="stage-value">1/3</strong></span>
            <span>Targets <strong id="targets-value">0/0</strong></span>
            <span>Pods <strong id="pods-value">0</strong></span>
            <span>Score <strong id="score-value">0</strong></span>
          </div>
        </header>

        <section class="hud controls" aria-label="Drop controls">
          <label class="control">
            <span>Angle</span>
            <input id="angle-input" type="range" min="-55" max="55" step="1" value="12" />
            <output id="angle-output">12 deg</output>
          </label>
          <label class="control">
            <span>Drill speed</span>
            <input id="speed-input" type="range" min="160" max="520" step="10" value="330" />
            <output id="speed-output">330</output>
          </label>
          <label class="control">
            <span>Drop delay</span>
            <input id="delay-input" type="range" min="0" max="1.8" step="0.05" value="0.45" />
            <output id="delay-output">0.45 s</output>
          </label>
          <button id="drop-button" class="primary" type="button" title="Drop pod">
            <i data-lucide="send" aria-hidden="true"></i>
            <span>Drop</span>
          </button>
          <button id="bomb-config-button" class="tool-button" type="button" title="Bomb setup">
            <i data-lucide="sliders-horizontal" aria-hidden="true"></i>
            <span class="button-label">Bomb</span>
          </button>
          <button id="reset-button" class="icon-button" type="button" title="Reset">
            <i data-lucide="rotate-ccw" aria-hidden="true"></i>
            <span class="sr-only">Reset</span>
          </button>
        </section>

        <section id="bomb-panel" class="hud bomb-panel" aria-label="Bomb setup" hidden>
          <header class="panel-head">
            <strong>Bomb setup</strong>
            <button id="bomb-close-button" class="icon-button" type="button" title="Close">
              <i data-lucide="x" aria-hidden="true"></i>
              <span class="sr-only">Close</span>
            </button>
          </header>

          <div class="segmented" role="group" aria-label="Apply setup">
            <button id="scope-all-button" class="segment is-active" type="button" data-scope="all">All pods</button>
            <button id="scope-next-button" class="segment" type="button" data-scope="next">Next pod</button>
          </div>

          <div class="segmented" role="group" aria-label="Bomb type">
            <button class="segment is-active" type="button" data-bomb-type="drill">Drill</button>
            <button class="segment" type="button" data-bomb-type="bounce">Bounce</button>
            <button class="segment" type="button" data-bomb-type="timer">Timer</button>
          </div>

          <label class="control">
            <span>Explode delay</span>
            <input id="fuse-input" type="range" min="0.35" max="3" step="0.05" value="1.35" />
            <output id="fuse-output">1.35 s</output>
          </label>

          <label class="control">
            <span>Blast radius</span>
            <input id="blast-input" type="range" min="24" max="62" step="2" value="42" />
            <output id="blast-output">42</output>
          </label>

          <label class="control">
            <span>Drill walls</span>
            <input id="drill-walls-input" type="range" min="1" max="7" step="1" value="3" />
            <output id="drill-walls-output">3</output>
          </label>

          <label class="control">
            <span>Bounces</span>
            <input id="bounce-count-input" type="range" min="1" max="3" step="1" value="1" />
            <output id="bounce-count-output">1</output>
          </label>

          <div id="bomb-summary" class="bomb-summary">All pods: drill, 3 walls, 1.35 s</div>
        </section>

        <div id="message" class="message" aria-live="polite"></div>
      </section>
    </main>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
    <script src="./src/game.js?v=bomb-setup-1"></script>
  </body>
</html>
